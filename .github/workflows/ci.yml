name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas (selectores, almacenamiento y datos iniciales contra el historial)
        run: npm test
      - name: Compilar
        run: npm run build
      - name: Compilar la página de claude.ai (sin datos iniciales)
        run: npm run build:claude
